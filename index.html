<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Civil Calculator - Blocks & Cement</title>
<style>
body{font-family:Arial;background:#f2f2f2;padding:20px;text-align:center}
.box{background:white;padding:20px;border-radius:15px;max-width:400px;margin:auto;box-shadow:0 0 10px #ccc}
h1{color:#1a73e8;font-size:22px}
input{width:90%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:8px;font-size:16px}
button{background:#1a73e8;color:white;border:none;padding:14px;width:95%;border-radius:10px;font-size:18px;font-weight:bold}
.result{margin-top:15px;background:#e8f0fe;padding:15px;border-radius:10px;font-size:18px;line-height:1.6}
small{color:#666}
</style>
</head>
<body>
<div class="box">
<h1>🧱 HEAVENGATE CONSTRUCTION</h1>
<p>Blocks & Cement Estimator</p>
<h2>SUBSTRUTURE (FOUNDATION)</h2>
<h3>Excavation</h3>
  <label>Excavation Length (m)</label><br>
<input type="number" id="excLength" placeholder="e.g. 20"><br><br>
<label>Excavation Width (m)</label><br>
<input type="number" id="excWidth" placeholder="e.g. 0.6"><br><br>
<label>Excavation Depth (m)</label><br>
<input type="number" id="excDepth" placeholder="e.g. 0.9"><br><br>
  <h3>Concrete in Foundation</h3>
<label>Concrete Length (m)</label><br>
<input type="number" id="concLength" placeholder="e.g. 20"><br><br>
<label>Concrete Width (m)</label><br>
<input type="number" id="concWidth" placeholder="e.g. 0.6"><br><br>
<label>Concrete Thickness (m)</label><br>
<input type="number" id="concThick" placeholder="e.g. 0.15"><br><br>
  <h3>Pad Excavation</h3>
<label>Number of Pads</label><br>
<input type="number" id="padNo" placeholder="e.g. 12"><br><br>
<label>Pad Length (m)</label><br>
<input type="number" id="padLength" placeholder="e.g. 1.2"><br><br>
<label>Pad Width (m)</label><br>
<input type="number" id="padWidth" placeholder="e.g. 1.2"><br><br>
<label>Pad Depth (m)</label><br>
<input type="number" id="padDepth" placeholder="e.g. 1.2"><br><br>
<h3>Raft Excavation</h3>
<label>Raft Length (m)</label><br>
<input type="number" id="raftLength" placeholder="e.g. 12"><br><br>
<label>Raft Width (m)</label><br>
<input type="number" id="raftWidth" placeholder="e.g. 10"><br><br>
<label>Raft Depth (m)</label><br>
<input type="number" id="raftDepth" placeholder="e.g. 0.6"><br><br>
<label>Wall Length (in metres)</label><br>
<input type="number" id="length" placeholder="e.g. 10"><br>
<label>Wall Height (in metres)</label><br>
<input type="number" id="height" placeholder="e.g. 3"><br>
<button onclick="calculate()">CALCULATE</button>
<div class="result" id="result">Result go show here 👇</div>
<p><small>Built by Engr Ogbole Ameh</small></p>
</div>
<script>
function calculate(){
  let get = id => parseFloat(document.getElementById(id).value) || 0;
  let excVol = get('excLength') * get('excWidth') * get('excDepth');
  let concVol = get('concLength') * get('concWidth') * get('concThick');
  let padVol = get('padNo') * get('padLength') * get('padWidth') * get('padDepth');
  let raftVol = get('raftLength') * get('raftWidth') * get('raftDepth');
  let l = get('length');
  let h = get('height');
  let area = l * h;
  let blocks = Math.ceil(area * 12.5);
  let cement = (blocks * 0.0168).toFixed(1);
  let sand = (area * 0.05).toFixed(2);
    let totalConc = concVol + padVol + raftVol;
  let wood = (totalConc * 4).toFixed(2);
  let boards = Math.ceil(totalConc * 4 / 2.5);
  let steel = (totalConc * 100).toFixed(1);
  document.getElementById('result').innerHTML =
    '<b>Excavation (Strip):</b> ' + excVol.toFixed(2) + ' m3<br>' +
    '<b>Concrete in Foundation:</b> ' + concVol.toFixed(2) + ' m3<br>' +
    '<b>Pad Excavation:</b> ' + padVol.toFixed(2) + ' m3<br>' +
    '<b>Raft Excavation:</b> ' + raftVol.toFixed(2) + ' m3<br>' +
    'Wall Area: ' + area.toFixed(2) + ' m2<br>' +
    '🧱 Blocks Needed: <b>' + blocks + '</b><br>' +
    '💰 Cement Needed: <b>' + cement + '</b> Bags<br>' +
    '🏖️ Sand Needed: <b>' + sand + '</b> Tonnes<br>' +
'🪵 Wood Formwork: <b>' + wood + '</b> m2 (' + boards + ' Boards)<br>' +
'🔩 Reinforcement Steel: <b>' + steel + '</b> Kg';
}</script>
</body>
</html>
